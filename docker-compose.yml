services:
  postgres:
    image: postgres:16
    container_name: uei_postgres
    environment:
      POSTGRES_USER: uei
      POSTGRES_PASSWORD: uei
      POSTGRES_DB: uei
    ports:
      - "5432:5432"
    volumes:
      - uei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uei -d uei"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: uei_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./services/api
    container_name: uei_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://uei:uei@postgres:5432/uei
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_TOKEN: local-dev-token
    volumes:
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./services/worker
    container_name: uei_worker
    environment:
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8000
      INTERNAL_API_TOKEN: local-dev-token
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  uei_pgdata:
